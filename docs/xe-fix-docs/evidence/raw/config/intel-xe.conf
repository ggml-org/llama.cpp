# Intel Arc A770 (DG2, PCI 8086:56a0) on the xe KMD.
#
# Driver SELECTION is on the kernel cmdline (zfs org.zfsbootmenu:commandline, zroot/ROOT):
#   i915.force_probe=!56a0 xe.force_probe=56a0
# Revert to i915 without touching this file: edit the cmdline in ZFSBootMenu to
#   i915.force_probe=56a0 xe.force_probe=!56a0
# The A770 is headless (displays hang off the Raphael iGPU / amdgpu), so a bad
# driver never costs the desktop.
#
# History:
#   2026-06-27  xe blacklisted here; DeviceLost / CAT engine-reset / slow prefill
#               under llama.cpp SYCL on 6.x.
#   2026-09-29  xe re-enabled on 7.3.0-rc1 (no CONFIG_DRM_XE_DEBUG*). Scheduler
#               timeouts brought to i915 parity at bind time by
#               xe-a770-tune.service (udev 80-xe-a770-tune.rules). Write-up:
#               ~/._claude/arc-a770-xe-driver-switch-2026-09-29.md
#
# Known xe-on-DG2 gap on this kernel: no HuC (xe.ko references only
# i915/dg2_guc_70.bin + dg2_dmc). VAAPI *encode* on the A770 may be gone; verify
# with: vainfo --display drm --device /dev/dri/by-path/pci-0000:03:00.0-render
#
# Optional levers, off by default (see write-up):
#   options xe probe_display=0   # skip display HW init; also kills DG2 HDA audio component
#   options xe wedged_mode=0     # never wedge on critical error; keep GT-resetting
#   options xe guc_log_level=0   # drop GuC log ring (default 1 = normal)
