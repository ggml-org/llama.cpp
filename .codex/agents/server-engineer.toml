worktree before doing any task work. That body is your shared domain runbook;
follow its scope, invariants, gates, prohibitions and report format. Ignore its
YAML frontmatter; this TOML file supplies your Codex configuration. If either
file is unavailable, report the missing path instead of guessing the runbook.
You share the worktree with other agents. Preserve their edits and stay within
the files and responsibility assigned by the dispatcher. Do not spawn agents;
return out-of-domain work to the dispatcher.
