[general]
#version of ggml-hexagon
version = "0.99.6"

#enable/disable dump diag info for troubleshooting issues on AP side
#0 = disable
#1 = enable
dump_debug_info = 0

#offload ggml op to Hexagon cDSP directly
[cdsp]

#number of Hexagon devices (PDs) to use
#1  = single device (default, one cDSP PD on domain 3)
#2+ = multi-device, each additional device reserves a new PD via FASTRPC_RESERVE_NEW_SESSION
#can be overridden by GGML_HEXAGON_NDEV env var
ndev = 1

#enable/disable multi-threading on cDSP side
# 1    disable multi-threading on cDSP side
# 2-8  thread_counts on cDSP side
#note: DSP side clamps to (max_hw_threads - 2) since an op needs
#      thread_counts+1 co-resident threads (main + workers + hmx_queue).
#      v75/8Gen3 (6 hw threads) -> effective max 4; v79/8Elite (8) -> max 6.
#      exceeding the limit deadlocks the work-queue barrier.
thread_counts = 6

#enable/disable cgraph reorder pass:the pass stacks MUL_MAT ops sharing
#the same src1 to improve DSP VTCM
#cache locality.
# 0 = skip the reorder pass (cgraph as built by llama.cpp)
# 1 = call the reorder pass (default)
enable_graph_optimize = 1

#enable/disable dump diag info for troubleshooting issues on cDSP side
#0 = disable
#1 = enable
dump_diag_info = 0

#ION cache coherency mode for AP <-> DSP data transfer
# 0 = both (DC CVAC/CIVAC + DMA_BUF_IOCTL_SYNC)
# 1 = ion_sync only (skip manual DC CVAC/CIVAC, rely on kernel DMA_BUF_IOCTL_SYNC)
# 2 = DC CVAC/CIVAC only (skip ion_sync, manual cache maintenance only)
ion_sync_mode = 1

#FastRPC ION mempool mapping mode
# 0 = FASTRPC_MAP_FD_DELAYED (default): kernel registers the fd but defers DSP-side
#     mapping until the DSP calls HAP_mmap2(). Lower startup memory pressure.
# 1 = FASTRPC_MAP_FD (eager pinning): kernel creates the mapping and pins physical
#     pages immediately. Useful for A/B testing first-batch latency variance.
rpc_mmap_mode = 0

#enable/disable QKV/FFN op fusion (algotype=29 only)
# 0 = disable (for debugging)
# 1 = enable (default)
enable_opfusion = 1

#flash attention kernel selection (algotype=29 only)
# 0 = CPU (unsupported)
# 1 = HVX -> CPU
# 2 = HMX -> HVX -> CPU (default)
fa_select = 2

#comma-separated list of weight types to offload for MUL_MAT (empty = all supported types)
#example: enabled_types = Q4_0,Q4_1,Q5_0,Q8_0,IQ4_NL,BF16,F16
#use this to selectively enable/disable specific quantized types without recompilation
#F32 is always allowed
#enabled_types = Q4_0,Q4_1,Q5_0,Q8_0,IQ4_NL,BF16,MXFP4
enabled_types = F32,F16,BF16,Q4_0,Q8_0,Q4_1,IQ4_NL,MXFP4

#algotype=29 dispatches all supported ops via execute_op; set to "all" or
#the full comma-separated list from entry.c's ggml_op_to_htp_op mapping.
enabled_ops = all

#DSP-side entry.c cache optimization bitmask (default 7 = all three optimizations on).
#Pushed to DSP at init via execute_batch(0xFFFC) special mode (no IDL change).
#bits 0/1/2/3 are independent; flipping any subset is safe and self-consistent.
#  bit 0 (1): first-touch weight bitmap    - skip dcinva for repack weights (flags==2) after first access
#  bit 1 (2): skip dcinva for prior dst     - DSP's own dst writes stay in L2 across ops in same batch
#  bit 2 (4): bulk dst flush at batch end   - collect/sort/merge dst ranges, flush once per region
#  bit 3 (8): selective bulk flush          - skip batch-end flush for dsts that a later op in
#                                             the same batch still consumes (pure intermediates);
#                                             requires bit 2. Mirrored dsts and final outputs
#                                             (incl. KV write views) always flush.
#Notes:
#  - bit 1 alone is a no-op because the prior_dst list is populated only when
#    bit 2 is on (the per-op dst tracker writes to both lists together).
#  - bit 2 implicitly tracks prior_dst regardless of bit 1; if bit 1 is off
#    the list is populated but unused (safe, just a few extra cycles per op).
#  - bit 3 without bit 2 is a no-op (the bulk flush list is only used when bit 2 is on).
#Common patterns:
#  dsp_cache_mode = 0  - baseline behavior (no DSP-side cache opts; safe default)
#  dsp_cache_mode = 1  - first-touch weight only; safe default, equivalent to
#                          29c1cf196 baseline + 939fe26bc bit0 (bit2 disabled)
#  dsp_cache_mode = 2  - prior-dst only (no-op unless bit 2 also set)
#  dsp_cache_mode = 3  - first-touch weight + prior-dst (no-op for bit 1 alone)
#  dsp_cache_mode = 4  - bulk dst flush only (current default; safe across all
#                          tested models; bit 0 first-touch disabled due to
#                          stochastic garble risk on qwen1/qwen3-mtp observed
#                          2026-07-14)
#  dsp_cache_mode = 5  - first-touch weight + bulk dst flush (safe baseline)
#  dsp_cache_mode = 6  - skip-prior-dst + bulk dst flush (safe with entry.c
#                          PRIOR_DST_MAX_LEN = cacheline, but gain is marginal)
#  dsp_cache_mode = 7  - all three on (safe under cacheline limit; best PP in tests)
#  dsp_cache_mode = 13 - 5 + selective bulk flush (bit 3, experimental; validate
#                          output correctness per model before enabling)
dsp_cache_mode = 5

# DSP-side cache trace enables. Both default to 0 (production) so perf is unaffected.
# Set to 1 only when diagnosing a stale-L2-read issue.
#
#  dsp_cache_trace_bit0 = 0  - off (default, no per-bit-0 log)
#  dsp_cache_trace_bit0 = 1  - emit one [DSP-CACHE-TRACE-BIT0] log line per bit 0
#                                (first-touch weight) decision: SKIP or INVAL, with
#                                op/src/ptr/len. Diagnoses the llama3 33% prompt-repeat
#                                bug observed 2026-07-10.
dsp_cache_trace_bit0 = 0
#
#  dsp_cache_trace_bit1 = 0  - off (default)
#  dsp_cache_trace_bit1 = 1  - emit one [DSP-CACHE-TRACE-BIT1] log line per bit 1
#                                (skip dcinva for prior dst) decision: SKIP if the
#                                src range was a prior dst in this batch, INVAL
#                                otherwise. Diagnoses why dsp_cache_mode 5/6/7
#                                garble on the new matmul pipeline (upstream
#                                81ff7abe5). Pair with dsp_cache_trace_bit0=1 to
#                                localize the stale-L2-read culprit to a specific
#                                bit/op combination.
dsp_cache_trace_bit1 = 0
