name: tiered-memory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "include/llama-tiered.h"
      - "scripts/apply-tiered-*.py"
      - "src/llama-tiered.cpp"
      - "src/llama-mmap.*"
      - "src/CMakeLists.txt"
      - "ggml/include/ggml-cuda.h"
      - "ggml/src/ggml-cuda/**"
      - "examples/tiered-memory/**"
      - "examples/tiered-server/**"
      - ".github/workflows/tiered-memory.yml"
  push:
    branches:
      - master
    paths:
      - "include/llama-tiered.h"
      - "scripts/apply-tiered-*.py"
      - "src/llama-tiered.cpp"
      - "src/llama-mmap.*"
      - "src/CMakeLists.txt"
      - "ggml/include/ggml-cuda.h"
      - "ggml/src/ggml-cuda/**"
      - "examples/tiered-memory/**"
      - "examples/tiered-server/**"
      - ".github/workflows/tiered-memory.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure upstream-compatible CPU build
        run: >-
          cmake -S . -B build
          -DGGML_CUDA=OFF
          -DLLAMA_BUILD_EXAMPLES=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_APP=OFF
      - name: Build llama library
        run: cmake --build build --target llama -j2

  cuda-build:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake git g++ make pkg-config python3
      - uses: actions/checkout@v6
      - name: Apply Summer compatibility and hot-path transforms
        run: |
          python3 scripts/apply-tiered-upstream-compat.py
          python3 scripts/apply-tiered-hotpath-optimizations.py
      - name: Configure CUDA tiered build
        run: >-
          cmake -S . -B build
          -DGGML_CUDA=ON
          -DCMAKE_CUDA_ARCHITECTURES=89
          -DGGML_BACKEND_DL=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DLLAMA_BUILD_EXAMPLES=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DLLAMA_BUILD_APP=OFF
      - name: Build CUDA tiered target
        run: cmake --build build --target llama-tiered -j2
