name: Bench nightly (DGX Spark)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test, e.g. b12034 (default: newest with arm64 CUDA assets)'
        required: false
        type: string
      suites:
        description: 'Comma-separated suites: engine,speedbench,serving,agentic,quality,decision (default: all)'
        required: false
        type: string
      models:
        description: 'Comma-separated models from suite.yaml, e.g. M3,M5 (default: all)'
        required: false
        type: string
      configs:
        description: 'Comma-separated shell patterns on config names, e.g. mooncake_T02*,depth32768*_c8 (default: all)'
        required: false
        type: string
      resume:
        description: 'Finish an interrupted night into its report, e.g. 2026-11-11_b12284: its ok runs are kept, the rest run on its build'
        required: false
        type: string

# never on pull requests: the runner is a shared, persistent box
permissions:
  contents: read

concurrency:
  group: bench-nightly-spark
  cancel-in-progress: false

jobs:
  bench:
    # the schedule stays off until the repo variable SPARK_BENCH_NIGHTLY is 'true'
    if: github.event_name == 'workflow_dispatch' || vars.SPARK_BENCH_NIGHTLY == 'true'
    runs-on: [self-hosted, Linux, gb10, perf]
    container:
      image: "nvidia/cuda:13.5.0-devel-ubuntu26.04"
      options: --gpus all
      # models, builds and earlier nights live on the host, mounted at the same path so the paths in their manifests hold
      volumes:
        - ${{ vars.SPARK_BENCH_HOME || '/opt/llama-nightly' }}:${{ vars.SPARK_BENCH_HOME || '/opt/llama-nightly' }}
    # M1-M5: ~5.5 h measured and estimated (tools/server/bench/nightly/BENCHMARKS.md)
    timeout-minutes: 480
    defaults:
      run:
        shell: bash

    env:
      NIGHTLY_HOME: ${{ vars.SPARK_BENCH_HOME || '/opt/llama-nightly' }}
      BENCH_DIR: tools/server/bench/nightly
      # the venv is rebuilt in every container; uv's cache and Python stay on the host to keep that quick
      VENV: /opt/bench-venv
      UV_CACHE_DIR: ${{ vars.SPARK_BENCH_HOME || '/opt/llama-nightly' }}/container/uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ vars.SPARK_BENCH_HOME || '/opt/llama-nightly' }}/container/uv-python
      UV_LINK_MODE: copy
      # tokenizers and SPEED-Bench
      HF_HOME: ${{ vars.SPARK_BENCH_HOME || '/opt/llama-nightly' }}/container/hf-cache

    steps:
      - name: Dependencies
        id: depends
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl unzip python3 python3-venv

      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Python venv
        id: venv
        # uv-managed Python 3.12: aiperf needs <3.14 and Python headers to build crick on arm64
        run: |
          python3 -m venv /opt/uv-venv
          /opt/uv-venv/bin/pip install -q uv
          /opt/uv-venv/bin/uv venv -q --python 3.12 --managed-python "$VENV"
          VIRTUAL_ENV="$VENV" /opt/uv-venv/bin/uv pip install -q -r "$BENCH_DIR/requirements.txt"

      - name: Prefetch build, models and data
        id: prefetch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MODELS: ${{ inputs.models }}
        run: |
          "$VENV/bin/python" "$BENCH_DIR/nightly.py" prefetch ${TAG:+--tag "$TAG"} ${MODELS:+--models "$MODELS"}

      - name: Run suites
        id: run
        # not HF offline: speed_bench.py needs the dataset config list and AIPerf rejects a partial tokenizer snapshot offline
        env:
          SUITES: ${{ inputs.suites }}
          MODELS: ${{ inputs.models }}
          CONFIGS: ${{ inputs.configs }}
          RESUME: ${{ inputs.resume }}
          NIGHTLY_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$VENV/bin/python" "$BENCH_DIR/nightly.py" run ${SUITES:+--suites "$SUITES"} ${MODELS:+--models "$MODELS"} ${CONFIGS:+--configs "$CONFIGS"} ${RESUME:+--resume "$RESUME"} --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() && steps.run.outputs.night_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-nightly-${{ steps.run.outputs.night_id }}
          path: ${{ steps.run.outputs.night_dir }}
          retention-days: 30

      - name: Return files to the host user
        if: ${{ always() }}
        # the container runs as root; jobs on the host (the weekly) share NIGHTLY_HOME and the runner's work folder
        run: |
          owner=$(stat -c %u:%g "$NIGHTLY_HOME")
          find "$NIGHTLY_HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" ! -uid "${owner%:*}" -exec chown -h "$owner" {} +
