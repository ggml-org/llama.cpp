name: Bench nightly (DGX Spark)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test, e.g. b12034 (default: newest with arm64 CUDA assets)'
        required: false
        type: string
      suites:
        description: 'Comma-separated suites: engine,speedbench,serving,agentic,quality,decision (default: all)'
        required: false
        type: string
      models:
        description: 'Comma-separated models from suite.yaml, e.g. M3,M5 (default: all)'
        required: false
        type: string
      configs:
        description: 'Comma-separated shell patterns on config names, e.g. mooncake_T02*,depth32768*_c8 (default: all)'
        required: false
        type: string
      resume:
        description: 'Finish an interrupted night into its report, e.g. 2026-11-11_b12284: its ok runs are kept, the rest run on its build'
        required: false
        type: string

# never on pull requests: the runner is a shared, persistent box
cache-mode: none
permissions:
  actions: write
  contents: read

concurrency:
  group: bench-nightly-spark
  cancel-in-progress: false

jobs:
  bench:
    runs-on: [self-hosted, Linux, gb10, perf]
    container:
      # 24.04: its Python 3.12 suits aiperf (<3.14)
      image: "nvidia/cuda:13.5.0-devel-ubuntu24.04"
      options: --gpus all
    # M1-M5: ~6.8 h measured (tools/server/bench/nightly/BENCHMARKS.md)
    timeout-minutes: 480
    defaults:
      run:
        shell: bash

    env:
      BENCH_DIR: tools/server/bench/nightly
      # rebuilt in every container (~1 min)
      VENV: /opt/bench-venv

    steps:
      - name: Bench home
        id: home
        # models, builds and earlier nights: next to the checkouts in the runner's work folder, which the runner
        # mounts into the container and keeps between jobs (the weekly uses the same folder)
        run: |
          home="$(dirname "$RUNNER_WORKSPACE")/llama-nightly"
          {
            echo "NIGHTLY_HOME=$home"
            echo "HF_HOME=$home/container/hf-cache"
          } >> "$GITHUB_ENV"

      - name: Dependencies
        id: depends
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl unzip python3 python3-dev python3-venv

      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Python venv
        id: venv
        # python3-dev: aiperf builds crick from source on arm64
        run: |
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q -r "$BENCH_DIR/requirements.txt"

      - name: Prefetch build, models and data
        id: prefetch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MODELS: ${{ inputs.models }}
        run: |
          "$VENV/bin/python" "$BENCH_DIR/nightly.py" prefetch ${TAG:+--tag "$TAG"} ${MODELS:+--models "$MODELS"}

      - name: Run suites
        id: run
        # not HF offline: speed_bench.py needs the dataset config list and AIPerf rejects a partial tokenizer snapshot offline
        env:
          SUITES: ${{ inputs.suites }}
          MODELS: ${{ inputs.models }}
          CONFIGS: ${{ inputs.configs }}
          RESUME: ${{ inputs.resume }}
          NIGHTLY_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$VENV/bin/python" "$BENCH_DIR/nightly.py" run ${SUITES:+--suites "$SUITES"} ${MODELS:+--models "$MODELS"} ${CONFIGS:+--configs "$CONFIGS"} ${RESUME:+--resume "$RESUME"} --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() && steps.run.outputs.night_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-nightly-${{ steps.run.outputs.night_id }}
          path: ${{ steps.run.outputs.night_dir }}
          retention-days: 30

      - name: Return files to the host user
        if: ${{ always() }}
        # the container runs as root; the runner on the host reuses the work folder
        run: |
          owner=$(stat -c %u:%g "$(dirname "$NIGHTLY_HOME")")
          find "$NIGHTLY_HOME" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" ! -uid "${owner%:*}" -exec chown -h "$owner" {} +
