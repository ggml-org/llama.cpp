name: publish-release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref_name, 'release/v')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          notes="RELEASE_NOTES_${tag}.md"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ ! -f "$notes" ]]; then
            echo "release notes not found: $notes" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Validate release source
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/install-summer.sh
          python3 -m py_compile scripts/*.py
          test -f LICENSE
          test -f README.md
          test -f "${{ steps.release.outputs.notes }}"

      - name: Create tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag already exists: $TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Summer.cpp $TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(
              release create "$TAG"
              --verify-tag
              --title "Summer.cpp $TAG"
              --notes-file "$NOTES"
            )

            if [[ "$TAG" == *-* ]]; then
              args+=(--prerelease)
            else
              args+=(--latest)
            fi

            gh "${args[@]}"
          else
            echo "release already exists: $TAG"
          fi

      - name: Record published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          status_dir="$(mktemp -d)"
          git fetch origin master
          git worktree add "$status_dir/worktree" origin/master
          cd "$status_dir/worktree"

          mkdir -p .github/releases
          gh release view "$TAG" \
            --json tagName,name,url,isPrerelease,publishedAt,targetCommitish \
            > ".github/releases/${TAG}.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/releases/${TAG}.json"

          if git diff --cached --quiet; then
            echo "release metadata already recorded"
            exit 0
          fi

          git commit -m "release: record ${TAG} publication"
          git push origin HEAD:master
