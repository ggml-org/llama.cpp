name: Server (speculative decoding)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA1 to build'
        required: false
        type: string

permissions:
  contents: read

env:
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  server-speculative:
    runs-on: "hf-jobs-a100-large:cuda13"
    timeout-minutes: 60

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: Restore compact model cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/spec-models
          key: spec-methods-compact-v1-86835bf9-bc640142-5cbf9d20-5bee8a38

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake libssl-dev python3 python3-venv python3-pip

      - name: Build
        run: |
          cmake -B build -DGGML_CUDA=ON -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc
          cmake --build build --config Release -j $(nproc) --target llama-server

      - name: Python setup
        run: |
          cd tools/server/tests
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Test speculative decoding
        env:
          SPEC_METHODS: compact
          SPEC_MODEL_DIR: ${{ runner.temp }}/spec-models
          N_GPU_LAYERS: 99
        run: |
          cd tools/server/tests
          source venv/bin/activate
          PYTEST_WORKERS=1 ./tests.sh -s -v unit/test_spec_methods.py
