name: UI Lib Publish

# Publishes @ggml-org/llama-ui, the library in ui/lib/ui, to npm.
#
# The version in ui/lib/ui/package.json is the release. A commit that reaches master with a
# version npm does not have builds the library and publishes it; a commit that changes the
# library without bumping it publishes nothing and leaves a warning on the run, which is the
# drift that let 0.3.0 sit a day behind master. Bump the version in the PR whose change should
# ship, and this workflow does the rest.
#
# Auth: no npm token is stored here. The job exchanges its OIDC identity for one (npm trusted
# publishing) and signs the tarball with a provenance attestation, as release-publish.yml
# already does for GitHub releases. To wire it up, on npm: the package's Publishing settings,
# Trusted Publisher, GitHub Actions, repository ggml-org/llama.cpp, workflow
# ui-lib-publish.yml, and the environment below as the keyword. Until that exists the publish
# step fails, and every step before it still runs, so a dry run shows whether the release is
# ready.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack, but do not publish'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
    paths: [
      '.github/workflows/ui-lib-publish.yml',
      'ui/lib/ui/**.*'
    ]

cache-mode: none
permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  # queue, do not cancel: a version half-published cannot be taken back
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  LIB_DIR: ui/lib/ui

jobs:
  publish:
    name: Publish @ggml-org/llama-ui
    if: github.repository == 'ggml-org/llama.cpp'
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.LIB_DIR }}

      - name: Run type checking
        run: npm run check
        working-directory: ${{ env.LIB_DIR }}

      - name: Build the package and lint it
        run: npm run prepack
        working-directory: ${{ env.LIB_DIR }}

      - name: Compare the version with npm
        id: version
        run: node scripts/npm-version-check.mjs
        working-directory: ${{ env.LIB_DIR }}

      - name: Publish
        if: steps.version.outputs.should_publish == 'true' && inputs.dry_run != true
        # --ignore-scripts keeps the tarball the one prepack built and publint passed rather
        # than rebuilding it here; --provenance needs the id-token permission above. A package
        # published with nothing in it cannot be taken back, so refuse rather than guess.
        run: |
          test -d dist || { echo "dist/ is missing: nothing was built, so nothing is published"; exit 1; }
          npm publish --access public --provenance --ignore-scripts --tag "${{ steps.version.outputs.tag }}"
        working-directory: ${{ env.LIB_DIR }}

      - name: Verify it landed
        if: steps.version.outputs.should_publish == 'true' && inputs.dry_run != true
        run: |
          sleep 10
          echo "npm now holds ${{ steps.version.outputs.name }}@$(npm view "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" version) (was ${{ steps.version.outputs.latest || 'nothing' }})"
          npm view "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" dist-tags version dist.integrity

      - name: Report
        if: always()
        run: |
          {
            echo "### ${{ steps.version.outputs.name || '@ggml-org/llama-ui' }} ${{ steps.version.outputs.version }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| npm latest was | ${{ steps.version.outputs.latest || 'nothing published yet' }} |"
            echo "| verdict | \`${{ steps.version.outputs.verdict || 'not reached' }}\` |"
            echo "| published | ${{ inputs.dry_run == true && 'no (dry run)' || (steps.version.outputs.should_publish == 'true' && 'yes') || 'no' }} |"
            echo
            echo "> ${{ steps.version.outputs.note }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mind the verdict
        if: always() && steps.version.outcome == 'success'
        # a version going backwards is a mistake; a version not bumped is usually one too, but
        # it is also what a stories-only commit looks like, so that only fails the run when the
        # repository variable UI_LIB_PUBLISH_FAIL_ON_UNBUMPED is set to true
        env:
          NOTE: ${{ steps.version.outputs.note }}
          VERDICT: ${{ steps.version.outputs.verdict }}
          FAIL_ON_UNBUMPED: ${{ vars.UI_LIB_PUBLISH_FAIL_ON_UNBUMPED }}
        run: |
          case "$VERDICT" in
            stale)
              echo "::error::$NOTE"
              exit 1 ;;
            published)
              if [ "$FAIL_ON_UNBUMPED" = "true" ]; then
                echo "::error::$NOTE"
                exit 1
              fi
              echo "::warning::$NOTE" ;;
          esac
