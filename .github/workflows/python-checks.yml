name: Python Checks

on:
  push:
    paths:
      - '.github/workflows/python-checks.yml'
      - 'ty.toml'
      - '**.py'
      - '**/requirements*.txt'
      # - 'pyrightconfig.json'
  pull_request:
    paths:
      - '.github/workflows/python-checks.yml'
      - 'ty.toml'
      - '**.py'
      - '**/requirements*.txt'
      # - 'pyrightconfig.json'

cache-mode: none
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-slim
    name: Python checks
    steps:
      - name: Check out source repository
        uses: actions/checkout@v6
      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          pip-install: -r requirements/requirements-all.txt ty==0.0.88
      # - name: Type-check with Pyright
      #   uses: jakebailey/pyright-action@v2
      #   with:
      #     version: 1.1.382
      #     level: warning
      #     warnings: true
      - name: Type-check with ty
        run: |
            ty check --exit-zero-on-warning --output-format=github
      - name: Test FP8 conversion
        run: python -m unittest discover -s tests -p 'test_conversion_fp8.py' -v
      - name: Test KV cache scales
        run: python -m unittest discover -s tests -p 'test_kv_cache_scales.py' -v
