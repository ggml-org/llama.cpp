name: HIP quality check

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths: [
      '.github/workflows/hip-quality-check.yml',
      '**/*.cu',
      '**/*.cuh',
      'ggml/src/ggml-hip/CMakeLists.txt',
      'ggml/src/ggml-cuda/vendors/hip.h',
      'scripts/hip/gcn-cdna-vgpr-check.py',
      'scripts/hip/gcn-cdna-occupancy-check.py'
    ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/hip-quality-check.yml',
      '**/*.cu',
      '**/*.cuh',
      'ggml/src/ggml-hip/CMakeLists.txt',
      'ggml/src/ggml-cuda/vendors/hip.h',
      'scripts/hip/gcn-cdna-vgpr-check.py',
      'scripts/hip/gcn-cdna-occupancy-check.py'
    ]

cache-mode: none
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  ubuntu-22-hip-quality-check:
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:7.2.1
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake rocblas-dev hipblas-dev libssl-dev python3 python3-venv python3-pip jq

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          restore: false
          save: false

      - name: ccache-buckets-restore
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
        with:
          key: hip-quality-check-ubuntu-22.04
          folder: llama.cpp
          hf_bucket: ggml-org/cache

      - name: Build with Werror
        id: cmake_build
        run: |
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DGPU_TARGETS=gfx942 \
            -DGGML_HIP=ON \
            -DGGML_HIP_EXPORT_METRICS=Off \
            -DCMAKE_HIP_FLAGS="-Werror -Wno-tautological-compare" \
            -DCMAKE_BUILD_TYPE=Release
          cd build
          make -j $(nproc)

      - name: Check for major VGPR spills
        id: vgpr_check
        run: |
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DGPU_TARGETS=gfx908 \
            -DGGML_HIP=ON \
            -DGGML_HIP_EXPORT_METRICS=On \
            -DCMAKE_HIP_FLAGS="" \
            -DCMAKE_BUILD_TYPE=Release
          cd build
          make -j $(nproc) 2>&1 | tee metrics.log | grep -v 'Rpass-analysis=kernel-resource-usage\|remark:\|^$'
          python3 ../scripts/hip/gcn-cdna-vgpr-check.py metrics.log

      # On master pushes, cache the metrics log as the baseline for PR checks.
      - name: Save master metrics baseline
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: cp build/metrics.log hip-baseline-metrics.log

      - name: Cache master metrics baseline
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v5
        with:
          path: hip-baseline-metrics.log
          key: hip-quality-check-master-metrics-${{ github.sha }}

      # On PRs, restore the baseline metrics log cached from the master tip.
      # The PR build reuses the same build as the VGPR spill check above.
      - name: Get master tip SHA
        if: ${{ github.event_name == 'pull_request' }}
        id: master_sha
        run: echo "sha=$(git ls-remote origin refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore master metrics baseline
        if: ${{ github.event_name == 'pull_request' }}
        id: baseline_cache
        uses: actions/cache/restore@v5
        with:
          path: hip-baseline-metrics.log
          key: hip-quality-check-master-metrics-${{ steps.master_sha.outputs.sha }}

      # Fallback when the master tip has no cached baseline yet.
      - name: Checkout baseline (master)
        if: ${{ github.event_name == 'pull_request' && steps.baseline_cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.master_sha.outputs.sha }}
          path: hip-baseline

      - name: Build master metrics baseline
        if: ${{ github.event_name == 'pull_request' && steps.baseline_cache.outputs.cache-hit != 'true' }}
        run: |
          cd hip-baseline
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DGPU_TARGETS=gfx908 \
            -DGGML_HIP=ON \
            -DGGML_HIP_EXPORT_METRICS=On \
            -DCMAKE_HIP_FLAGS="" \
            -DCMAKE_BUILD_TYPE=Release
          cd build
          make -j $(nproc) 2>&1 | tee metrics.log | grep -v 'Rpass-analysis=kernel-resource-usage\|remark:\|^$'
          cp metrics.log ../../hip-baseline-metrics.log

      - name: Check for occupancy regressions vs master
        if: ${{ github.event_name == 'pull_request' }}
        id: occupancy_check
        run: |
          # The PR metrics.log comes from the VGPR spill check build above, so
          # this step adds no extra build when the baseline cache hits.
          python3 scripts/hip/gcn-cdna-occupancy-check.py hip-baseline-metrics.log build/metrics.log

      - name: ccache-buckets-save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CACHE_OUTPUT }}
        with:
          key: hip-quality-check-ubuntu-22.04
          folder: llama.cpp
          evict-old-files: 1d
          hf_bucket: ggml-org/cache
          save: true
