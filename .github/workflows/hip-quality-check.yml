name: HIP quality check

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths: [
      '.github/workflows/hip-quality-check.yml',
      '**/*.cu',
      '**/*.cuh',
      'ggml/src/ggml-hip/CMakeLists.txt',
      'ggml/src/ggml-cuda/vendors/hip.h',
      'scripts/hip/gcn-cdna-vgpr-check.py'
    ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/hip-quality-check.yml',
      '**/*.cu',
      '**/*.cuh',
      'ggml/src/ggml-hip/CMakeLists.txt',
      'ggml/src/ggml-cuda/vendors/hip.h',
      'scripts/hip/gcn-cdna-vgpr-check.py'
    ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  ubuntu-22-hip-quality-check:
    name: HIP Werror + VGPR (${{ matrix.gpu_target }})
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:7.2.4
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        # GCN, CDNA1, CDNA2, CDNA3, RDNA1, RDNA2, RDNA3, RDNA3.5, RDNA4
        gpu_target: [gfx906, gfx908, gfx90a, gfx942, gfx1010, gfx1030, gfx1100, gfx1151, gfx1201]

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake rocblas-dev hipblas-dev libssl-dev python3 python3-venv python3-pip jq

      - name: ccache
        id: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          restore: false
          save: false

      - name: ccache-buckets-restore
        id: ccache_restore
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
        with:
          key: hip-quality-check-ubuntu-22.04-${{ matrix.gpu_target }}
          folder: llama.cpp
          hf_bucket: ggml-org/cache

      - name: Build with Werror and metrics
        id: cmake_build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
            -DGPU_TARGETS=${{ matrix.gpu_target }} \
            -DGGML_HIP=ON \
            -DGGML_HIP_EXPORT_METRICS=ON \
            -DCMAKE_HIP_FLAGS="-Werror -Wno-tautological-compare" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --parallel "$(nproc)" 2>&1 | tee metrics.log | grep -v 'Rpass-analysis=kernel-resource-usage\|remark:\|^$'

      - name: Check for major VGPR spills
        id: vgpr_check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/hip/gcn-cdna-vgpr-check.py metrics.log

      - name: ccache-buckets-save
        id: ccache_save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: ./.github/actions/ccache-buckets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CACHE_OUTPUT }}
        with:
          key: hip-quality-check-ubuntu-22.04-${{ matrix.gpu_target }}
          folder: llama.cpp
          evict-old-files: 1d
          hf_bucket: ggml-org/cache
          save: true
