name: UI Preview Space link

# Links a pull request to the preview Space its author deployed from their fork (see ui-preview-space.yml),
# as a GitHub deployment with a "View deployment" button, and retires the link when the pull request closes.
# ggml-org hosts nothing and holds no Hugging Face token: the Space is on the author's own account. This
# workflow only looks it up on the public Hub API, by the tag that names the fork and branch it was built
# from, so a private Space gets no link. It never checks out the pull request's code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
    paths: [
      'ui/apps/chat/**',
      'ui/lib/**'
    ]

permissions:
  deployments: write

# a newer push replaces a lookup still waiting for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  ENVIRONMENT: Llama Chat preview

jobs:
  link:
    name: Link the preview Space
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Find the Space and link it
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the tag scripts/space.ts gives a Space: sha1 of "<fork, lowercase>:<branch>"
          repo=$(printf '%s' "$HEAD_REPO" | tr '[:upper:]' '[:lower:]')
          tag="llama-ui-src-$(printf '%s:%s' "$repo" "$HEAD_REF" | sha1sum | cut -c1-12)"
          short="${HEAD_SHA:0:10}"
          id='' title=''

          # the fork deploys on the same push, so wait for it to reach this commit
          for attempt in $(seq 1 30); do
            id=$(curl -fsS "https://huggingface.co/api/spaces?filter=$tag&sort=lastModified&direction=-1&limit=5" \
              | jq -r '[.[] | select(.tags | index("llama-ui-preview"))][0].id // empty' || true)

            if [ -n "$id" ]; then
              title=$(curl -fsS "https://huggingface.co/api/spaces/$id/commits/main" | jq -r '.[0].title // empty' || true)
              [[ "$title" == *"$short"* ]] && break
            fi

            sleep 30
          done

          if [ -z "$id" ]; then
            echo "No public preview Space for $HEAD_REPO:$HEAD_REF (tag $tag): nothing to link"
            exit 0
          fi

          url=$(curl -fsS "https://huggingface.co/api/spaces/$id" | jq -r '.host // empty' || true)
          url="${url:-https://huggingface.co/spaces/$id}"

          if [[ "$title" == *"$short"* ]]; then
            description="Preview of $short on $id"
          else
            description="Preview on $id, not yet at $short"
          fi

          deployment=$(jq -n --arg ref "$HEAD_SHA" --arg env "$ENVIRONMENT" --arg desc "$description" --argjson pr "$PR" \
            '{ref: $ref, environment: $env, description: $desc, auto_merge: false, required_contexts: [],
              transient_environment: true, production_environment: false, payload: {pr: $pr}}' \
            | gh api "repos/$REPO/deployments" --input - --jq .id)

          # the earlier deployments of this pull request give way to this one
          gh api "repos/$REPO/deployments?environment=$(jq -rn --arg e "$ENVIRONMENT" '$e|@uri')&per_page=100" \
            --jq ".[] | select(.payload.pr == $PR and .id != $deployment) | .id" \
            | while read -r old; do
                gh api "repos/$REPO/deployments/$old/statuses" -f state=inactive >/dev/null
              done

          jq -n --arg url "$url" --arg desc "$description" \
            '{state: "success", environment_url: $url, description: $desc, auto_inactive: false}' \
            | gh api "repos/$REPO/deployments/$deployment/statuses" --input - >/dev/null

          echo "Linked $url"

  unlink:
    name: Retire the preview link
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04

    steps:
      - name: Mark the deployments of this pull request inactive
        run: |
          # the author's fork deletes the Space itself, within the hour
          gh api "repos/$REPO/deployments?environment=$(jq -rn --arg e "$ENVIRONMENT" '$e|@uri')&per_page=100" \
            --jq ".[] | select(.payload.pr == $PR) | .id" \
            | while read -r id; do
                gh api "repos/$REPO/deployments/$id/statuses" -f state=inactive >/dev/null
              done
