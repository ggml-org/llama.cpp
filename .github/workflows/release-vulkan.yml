# Build this fork's Vulkan binaries and attach them to a GitHub Release.
#
# This is a cut-down replacement for upstream release.yml, which cannot run here: its
# `release` job needs 16 other jobs (windows-cuda, sycl, rocm, ios, android) and a
# DEPLOY_KEY_RELEASE secret this fork does not have. The build steps below are lifted
# from that workflow so the artifacts stay comparable.
#
# Upstream's own `windows` Vulkan job packs only ggml-vulkan.dll and relies on a
# separate windows-cpu job for the executables. Neither runs here, so there would be
# nothing to combine — the Windows job below builds the whole thing in one go and
# ships a single self-contained archive instead.
#
# Manual trigger only. It never fires on push.
name: Release (Vulkan)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub Release, not only build artifacts'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"
  VULKAN_VERSION: 1.4.357.0

jobs:
  ubuntu-vulkan:
    runs-on: ubuntu-22.04

    outputs:
      tag: ${{ steps.tag.outputs.name }}

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Dependencies
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: release-ubuntu-22.04-vulkan

      # Same flags as the local build documented in the README. GGML_NATIVE=OFF and
      # GGML_CPU_ALL_VARIANTS=ON make the binary portable across x86-64 machines;
      # the $ORIGIN rpath lets the extracted folder find its own shared libraries.
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-x64.tar.gz \
            --transform "s,^\.,llama-${{ steps.tag.outputs.name }}," -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-x64.tar.gz
          name: llama-bin-ubuntu-vulkan-x64

  windows-vulkan:
    runs-on: windows-2025

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Install Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja

      # clang-cl via the llvm toolchain file, not plain MSVC. GGML_CPU_ALL_VARIANTS is
      # what makes the archive portable across x86-64 machines, and upstream only ever
      # builds that under clang (its windows-cpu job). vcvarsall is located through
      # vswhere so this does not break when the runner image bumps Visual Studio.
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DGGML_VULKAN=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=ON ^
            -DGGML_OPENMP_FETCH=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      # Everything in one archive: the executables, the CPU backend variants and
      # ggml-vulkan.dll. Unlike upstream's split artifacts there is nothing to combine.
      - name: Pack artifacts
        run: |
          copy LICENSE .\build\bin\Release\
          7z a -snl llama-${{ steps.tag.outputs.name }}-bin-win-vulkan-x64.zip .\build\bin\Release\*

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-win-vulkan-x64.zip
          name: llama-bin-win-vulkan-x64

  publish:
    needs: [ubuntu-vulkan, windows-vulkan]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          TAG: ${{ needs.ubuntu-vulkan.outputs.tag }}
        run: |
          sed "s/__TAG__/${TAG}/g" .github/release-notes.md > notes.md
          gh release create "${TAG}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Strix Halo Vulkan build ${TAG}" \
            --notes-file notes.md
