# Build the Ubuntu x64 Vulkan binary for this fork and attach it to a GitHub Release.
#
# This is a cut-down replacement for upstream release.yml, which cannot run here: its
# `release` job needs 16 other jobs (windows-cuda, sycl, rocm, ios, android) and a
# DEPLOY_KEY_RELEASE secret this fork does not have. The build steps below are lifted
# from the `ubuntu-vulkan` job of that workflow so the artifacts stay comparable.
#
# Manual trigger only. It never fires on push.
name: Release (Ubuntu Vulkan)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub Release, not only a build artifact'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

jobs:
  ubuntu-vulkan:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Dependencies
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: release-ubuntu-22.04-vulkan

      # Same flags as the local build documented in the README. GGML_NATIVE=OFF and
      # GGML_CPU_ALL_VARIANTS=ON make the binary portable across x86-64 machines;
      # the $ORIGIN rpath lets the extracted folder find its own shared libraries.
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Determine tag name
        id: tag
        uses: ./.github/actions/get-tag-name

      - name: Pack artifacts
        run: |
          cp LICENSE ./build/bin/
          tar -czf llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-x64.tar.gz \
            --transform "s,^\.,llama-${{ steps.tag.outputs.name }}," -C ./build/bin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-x64.tar.gz
          name: llama-bin-ubuntu-vulkan-x64.tar.gz

      - name: Create release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            llama-${{ steps.tag.outputs.name }}-bin-ubuntu-vulkan-x64.tar.gz \
            --repo "${{ github.repository }}" \
            --title "Strix Halo Vulkan build ${{ steps.tag.outputs.name }}" \
            --generate-notes
