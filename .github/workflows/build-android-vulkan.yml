name: CI (android-vulkan)

# Full Vulkan + hardware-acceleration Android build.
# Cross-compiles llama.cpp for Android using the NDK, while enabling the
# Vulkan GPU backend (GGML_VULKAN=ON) together with the dynamic backend
# loader (GGML_BACKEND_DL=ON) and the RPC backend (GGML_RPC=ON) so that
# the resulting binaries can use any Android GPU with a Vulkan driver
# (Adreno, Mali, PowerVR, Xclipse, ...) at runtime.
#
# The host (ubuntu-latest) needs the Vulkan SDK only to provide `glslc`
# and the SPIRV-Headers, which are consumed by `vulkan-shaders-gen`
# (built for the host) to compile the SPIR-V shaders that get embedded
# into the target `libggml-vulkan.so`.

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-android-vulkan.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.comp'
      - '**/*.glsl'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/build-android-vulkan.yml'
      - 'ggml/src/ggml-vulkan/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
  # Pinned NDK version — keep in sync with build-android.yml's `arm64` job
  # so the two CI pipelines produce ABI-compatible binaries.
  NDK_VERSION: "29.0.14206865"

jobs:
  android-vulkan:
    name: Android Vulkan (${{ matrix.android_abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary target: physical Android devices (phones, tablets,
          # Snapdragon X Elite laptops, ChromeOS devices, ...).
          - android_abi: arm64-v8a
            android_platform: android-28
            artifact_suffix: arm64-v8a
            cmake_arch: aarch64
          # Secondary target: Android emulators running on x86_64 hosts
          # with GPU acceleration (SwiftShader / host GPU passthrough).
          # Useful for QA and running test suites inside the emulator.
          - android_abi: x86_64
            android_platform: android-28
            artifact_suffix: x86_64
            cmake_arch: x86_64

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libssl-dev pkg-config

      # The Vulkan SDK is required on the *host* only, because
      # `vulkan-shaders-gen` is built for the host and needs `glslc`
      # plus SPIRV-Headers to compile SPIR-V shaders at build time.
      # The target `libggml-vulkan.so` does NOT link against the SDK —
      # at runtime it dlopens `libvulkan.so` from the Android system.
      - name: Get latest Vulkan SDK version
        id: vulkan_sdk_version
        run: |
          echo "VULKAN_SDK_VERSION=$(curl -s https://vulkan.lunarg.com/sdk/latest/linux.txt)" >> "$GITHUB_ENV"

      - name: Use Vulkan SDK Cache
        uses: actions/cache@v5
        id: cache-sdk
        with:
          path: ./vulkan_sdk
          key: cache-gha-vulkan-sdk-android-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}

      - name: Setup Vulkan SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}

      # The Android NDK toolchain hard-codes
      #   CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY
      # which restricts find_package() to paths inside the NDK sysroot.
      # The LunarG Vulkan SDK ships SPIRV-Headers on the host, but those
      # CMake config files (SPIRV-HeadersConfig.cmake) are NOT inside the
      # sysroot, so `find_package(SPIRV-Headers CONFIG REQUIRED)` fails
      # with the error:
      #   Could not find a package configuration file provided by
      #   "SPIRV-Headers" with any of the following names:
      #     SPIRV-HeadersConfig.cmake
      #     spirv-headers-config.cmake
      #
      # Workaround: clone SPIRV-Headers from Khronos and install both
      # the headers and the CMake config into the NDK sysroot, where
      # the Android toolchain's find_package will pick them up.
      #
      # We pin to the tag matching the bundled Vulkan SDK SPIRV-Headers
      # release to keep glslc (which compiles the .comp shaders) and the
      # SPIRV-Headers used by ggml-vulkan in sync.
      # Tag format on KhronosGroup/SPIRV-Headers is `vulkan-sdk-<version>`,
      # e.g. `vulkan-sdk-1.4.357.0` for Vulkan SDK 1.4.357.0.
      - name: Install SPIRV-Headers into NDK sysroot
        run: |
          source ./vulkan_sdk/setup-env.sh
          SYSROOT=${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          # LunarG tags SPIRV-Headers as `vulkan-sdk-<vulkan-sdk-version>`
          # on GitHub, e.g. `vulkan-sdk-1.4.357.0`.
          SPIRV_HEADERS_TAG="vulkan-sdk-${VULKAN_SDK_VERSION}"
          echo "Installing SPIRV-Headers tag ${SPIRV_HEADERS_TAG} into ${SYSROOT}/usr"
          # Try the tag first; if LunarG hasn't pushed the matching tag yet,
          # fall back to main (SPIRV-Headers is header-only with a stable API).
          if ! git clone --depth 1 --branch "${SPIRV_HEADERS_TAG}" \
                https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers; then
            echo "Tag ${SPIRV_HEADERS_TAG} not found, falling back to main branch"
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          fi
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --install /tmp/spirv-headers/build --prefix "${SYSROOT}/usr"
          # Sanity check — SPIRV-Headers installs its CMake config to
          # share/cmake/SPIRV-Headers/ (not lib/cmake/...).
          test -f "${SYSROOT}/usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" \
            && echo "OK: SPIRV-HeadersConfig.cmake installed" \
            || { echo "FAIL: SPIRV-HeadersConfig.cmake not found"; exit 1; }

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: android-vulkan-${{ matrix.android_abi }}
          variant: ccache
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Configure (CMake)
        id: cmake_configure
        run: |
          source ./vulkan_sdk/setup-env.sh
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.android_abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.android_platform }} \
            -DCMAKE_BUILD_TYPE=Release \
            \
            -DGGML_VULKAN=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_RPC=ON \
            \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_BORINGSSL=ON \
            \
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        id: cmake_build
        run: |
          source ./vulkan_sdk/setup-env.sh
          time cmake --build build --config Release -j $(nproc)

      - name: Install
        id: cmake_install
        run: |
          cmake --install build --prefix pkg-adb/llama.cpp --config Release

      # Quick sanity check that the Vulkan backend .so actually made it
      # into the install tree. This is a build-time check only — to
      # verify it loads at runtime you need a real device or emulator
      # with a Vulkan-capable GPU driver.
      - name: Verify Vulkan backend artifact
        run: |
          set -e
          echo "=== Installed shared libraries ==="
          find pkg-adb/llama.cpp -type f -name '*.so' | sort
          echo ""
          echo "=== Vulkan backend presence check ==="
          if compgen -G "pkg-adb/llama.cpp/lib*/libggml-vulkan.so" > /dev/null; then
            echo "OK: libggml-vulkan.so found in install tree"
          else
            echo "ERROR: libggml-vulkan.so missing from install tree"
            exit 1
          fi
          echo ""
          echo "=== Binaries ==="
          find pkg-adb/llama.cpp -type f -name 'llama-*' -executable | sort

      - name: Upload Android Vulkan Build Artifact
        if: ${{ always() && steps.cmake_install.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: llama-cpp-android-vulkan-${{ matrix.artifact_suffix }}
          path: pkg-adb/llama.cpp
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## Android Vulkan build — ${{ matrix.android_abi }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ABI | \`${{ matrix.android_abi }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`android-${{ matrix.android_platform }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| NDK | \`${{ env.NDK_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulkan SDK | \`${{ env.VULKAN_SDK_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`GGML_VULKAN=ON\` + \`GGML_BACKEND_DL=ON\` + \`GGML_RPC=ON\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Configure: \`${{ steps.cmake_configure.outcome }}\`  |  Build: \`${{ steps.cmake_build.outcome }}\`  |  Install: \`${{ steps.cmake_install.outcome }}\`" >> $GITHUB_STEP_SUMMARY
