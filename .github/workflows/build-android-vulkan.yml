name: CI (android-vulkan)

# Full Vulkan + hardware-acceleration Android build.
# Cross-compiles llama.cpp for Android using the NDK, while enabling the
# Vulkan GPU backend (GGML_VULKAN=ON) together with the dynamic backend
# loader (GGML_BACKEND_DL=ON) and the RPC backend (GGML_RPC=ON) so that
# the resulting binaries can use any Android GPU with a Vulkan driver
# (Adreno, Mali, PowerVR, Xclipse, ...) at runtime.
#
# The host (ubuntu-latest) needs the Vulkan SDK only to provide `glslc`
# and the SPIRV-Headers, which are consumed by `vulkan-shaders-gen`
# (built for the host) to compile the SPIR-V shaders that get embedded
# into the target `libggml-vulkan.so`.

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-android-vulkan.yml'
      - '**/CMakeLists.txt'
      - '**/.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.comp'
      - '**/*.glsl'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/build-android-vulkan.yml'
      - 'ggml/src/ggml-vulkan/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
  # Pinned NDK version — keep in sync with build-android.yml's `arm64` job
  # so the two CI pipelines produce ABI-compatible binaries.
  NDK_VERSION: "29.0.14206865"

jobs:
  android-vulkan:
    name: Android Vulkan (${{ matrix.android_abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary target: physical Android devices (phones, tablets,
          # Snapdragon X Elite laptops, ChromeOS devices, ...).
          - android_abi: arm64-v8a
            android_platform: android-28
            artifact_suffix: arm64-v8a
            cmake_arch: aarch64
          # Secondary target: Android emulators running on x86_64 hosts
          # with GPU acceleration (SwiftShader / host GPU passthrough).
          # Useful for QA and running test suites inside the emulator.
          - android_abi: x86_64
            android_platform: android-28
            artifact_suffix: x86_64
            cmake_arch: x86_64

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libssl-dev pkg-config

      # The Vulkan SDK is required on the *host* only, because
      # `vulkan-shaders-gen` is built for the host and needs `glslc`
      # plus SPIRV-Headers to compile SPIR-V shaders at build time.
      # The target `libggml-vulkan.so` does NOT link against the SDK —
      # at runtime it dlopens `libvulkan.so` from the Android system.
      - name: Get latest Vulkan SDK version
        id: vulkan_sdk_version
        run: |
          echo "VULKAN_SDK_VERSION=$(curl -s https://vulkan.lunarg.com/sdk/latest/linux.txt)" >> "$GITHUB_ENV"

      - name: Use Vulkan SDK Cache
        uses: actions/cache@v5
        id: cache-sdk
        with:
          path: ./vulkan_sdk
          key: cache-gha-vulkan-sdk-android-${{ env.VULKAN_SDK_VERSION }}-${{ runner.os }}

      - name: Setup Vulkan SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: ./.github/actions/linux-setup-vulkan
        with:
          path: ./vulkan_sdk
          version: ${{ env.VULKAN_SDK_VERSION }}

      # The Android NDK toolchain hard-codes
      #   CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY
      #   CMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY
      # which restricts both find_package() AND #include <...> searches
      # to paths inside the NDK sysroot.
      #
      # The LunarG Vulkan SDK ships two header libraries on the *host*:
      #   1. SPIRV-Headers  — needed by find_package(SPIRV-Headers CONFIG)
      #   2. Vulkan-Headers — needed by #include <vulkan/vulkan.hpp>
      #                       (the C++ Vulkan wrapper used by ggml-vulkan.cpp)
      #
      # The Android NDK sysroot ships `vulkan/vulkan.h` and
      # `vulkan/vulkan_core.h` (because Vulkan is part of Android's
      # stable API since API 24), but it does NOT ship the C++ wrapper
      # `vulkan/vulkan.hpp`. Without it, the build fails with:
      #
      #   ggml-vulkan.cpp:22:10: fatal error: 'vulkan/vulkan.hpp' file not found
      #     22 | #include <vulkan/vulkan.hpp>
      #
      # The original approach was to install both Khronos header sets
      # directly into the NDK sysroot. That fails because the sysroot
      # already contains root-owned `vulkan/` and `vk_video/` directories
      # shipped by the NDK, and `cmake --install` (running as the
      # `runner` user without sudo) cannot chmod them:
      #
      #   CMake Error at cmake_install.cmake:51 (file):
      #     file INSTALL cannot set permissions on
      #     ".../sysroot/usr/include/vk_video": Operation not permitted.
      #
      # Fix: install both Khronos header sets to a SEPARATE prefix
      # `$RUNNER_TEMP/khronos-headers` (guaranteed writable by the
      # `runner` user — no permission conflicts), then tell the Android
      # toolchain to ALSO search that prefix by extending
      # `CMAKE_FIND_ROOT_PATH`. Setting `CMAKE_PREFIX_PATH` alone is not
      # enough — the NDK toolchain's `CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY`
      # would still re-root the search to the sysroot only.
      #
      # The NDK toolchain itself doesn't explicitly set CMAKE_FIND_ROOT_PATH;
      # it only sets CMAKE_SYSROOT, and CMake auto-derives
      # CMAKE_FIND_ROOT_PATH=<sysroot> from it. Passing
      # `-DCMAKE_FIND_ROOT_PATH=<khronos-prefix>;<toolchain-root>` on the
      # cmake command line overrides that auto-derivation, so both paths
      # get searched.
      #
      # Both repos use the `vulkan-sdk-<version>` tag format on GitHub,
      # e.g. `vulkan-sdk-1.4.357.0` for Vulkan SDK 1.4.357.0.
      - name: Install SPIRV-Headers + Vulkan-Headers to $RUNNER_TEMP
        run: |
          source ./vulkan_sdk/setup-env.sh
          KHRONOS_PREFIX="${RUNNER_TEMP}/khronos-headers"
          KHRONOS_TAG="vulkan-sdk-${VULKAN_SDK_VERSION}"
          echo "Installing Khronos headers tag ${KHRONOS_TAG} into ${KHRONOS_PREFIX}"

          # ---- SPIRV-Headers ----
          if ! git clone --depth 1 --branch "${KHRONOS_TAG}" \
                https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers; then
            echo "Tag ${KHRONOS_TAG} not found on SPIRV-Headers, falling back to main"
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          fi
          cmake -S /tmp/spirv-headers -B /tmp/spirv-headers/build -DCMAKE_BUILD_TYPE=Release
          cmake --install /tmp/spirv-headers/build --prefix "${KHRONOS_PREFIX}"
          test -f "${KHRONOS_PREFIX}/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake" \
            && echo "OK: SPIRV-HeadersConfig.cmake installed" \
            || { echo "FAIL: SPIRV-HeadersConfig.cmake not found"; exit 1; }

          # ---- Vulkan-Headers (provides vulkan/vulkan.hpp C++ wrapper) ----
          if ! git clone --depth 1 --branch "${KHRONOS_TAG}" \
                https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers; then
            echo "Tag ${KHRONOS_TAG} not found on Vulkan-Headers, falling back to main"
            git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          fi
          cmake -S /tmp/vulkan-headers -B /tmp/vulkan-headers/build -DCMAKE_BUILD_TYPE=Release
          cmake --install /tmp/vulkan-headers/build --prefix "${KHRONOS_PREFIX}"
          test -f "${KHRONOS_PREFIX}/include/vulkan/vulkan.hpp" \
            && echo "OK: vulkan/vulkan.hpp installed" \
            || { echo "FAIL: vulkan/vulkan.hpp not found"; exit 1; }
          test -f "${KHRONOS_PREFIX}/include/vulkan/vulkan_core.h" \
            && echo "OK: vulkan/vulkan_core.h installed" \
            || { echo "FAIL: vulkan/vulkan_core.h not found"; exit 1; }
          test -f "${KHRONOS_PREFIX}/share/cmake/VulkanHeaders/VulkanHeadersConfig.cmake" \
            && echo "OK: VulkanHeadersConfig.cmake installed" \
            || { echo "FAIL: VulkanHeadersConfig.cmake not found"; exit 1; }

          # Surface the prefix path to subsequent steps via $GITHUB_ENV.
          echo "KHRONOS_PREFIX=${KHRONOS_PREFIX}" >> $GITHUB_ENV

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: android-vulkan-${{ matrix.android_abi }}
          variant: ccache
          evict-old-files: 1d
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Configure (CMake)
        id: cmake_configure
        run: |
          source ./vulkan_sdk/setup-env.sh
          # Extend CMAKE_FIND_ROOT_PATH with our Khronos prefix so the
          # Android toolchain's find_package() and #include searches
          # also look there. Without this, CMAKE_FIND_ROOT_PATH_MODE_*=ONLY
          # would re-root the search to the NDK sysroot only and ignore
          # both CMAKE_PREFIX_PATH and -I flags pointing outside the sysroot.
          #
          # Note: the NDK toolchain sets CMAKE_SYSROOT (which auto-derives
          # CMAKE_FIND_ROOT_PATH to <sysroot>), so we must include the
          # toolchain root explicitly in our override to keep the NDK
          # headers + libs discoverable.
          ANDROID_TOOLCHAIN_ROOT="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64"
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.android_abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.android_platform }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="${KHRONOS_PREFIX};${ANDROID_TOOLCHAIN_ROOT}" \
            -DCMAKE_PREFIX_PATH="${KHRONOS_PREFIX}" \
            \
            -DGGML_VULKAN=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_RPC=ON \
            \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_BORINGSSL=ON \
            \
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        id: cmake_build
        run: |
          source ./vulkan_sdk/setup-env.sh
          time cmake --build build --config Release -j $(nproc)

      - name: Install
        id: cmake_install
        run: |
          cmake --install build --prefix pkg-adb/llama.cpp --config Release

      - name: Upload Android Vulkan Build Artifact
        if: ${{ always() && steps.cmake_install.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: llama-cpp-android-vulkan-${{ matrix.artifact_suffix }}
          path: pkg-adb/llama.cpp
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## Android Vulkan build — ${{ matrix.android_abi }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ABI | \`${{ matrix.android_abi }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`android-${{ matrix.android_platform }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| NDK | \`${{ env.NDK_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulkan SDK | \`${{ env.VULKAN_SDK_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`GGML_VULKAN=ON\` + \`GGML_BACKEND_DL=ON\` + \`GGML_RPC=ON\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Configure: \`${{ steps.cmake_configure.outcome }}\`  |  Build: \`${{ steps.cmake_build.outcome }}\`  |  Install: \`${{ steps.cmake_install.outcome }}\`" >> $GITHUB_STEP_SUMMARY
