name: UI

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA1 to build'
        required: false
        type: string
  push:
    branches:
      - master
    paths: [
      '.github/workflows/ui.yml',
      '.github/workflows/ui-build.yml',
      'ui/apps/chat/**.*',
      'tools/server/tests/**.*'
    ]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/ui.yml',
      '.github/workflows/ui-build.yml',
      'ui/apps/chat/**.*',
      'tools/server/tests/**.*'
    ]

cache-mode: none
permissions:
  actions: read
  contents: read

env:
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1
  LLAMA_ARG_LOG_VERBOSITY: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ui-build:
    name: Build static output
    uses: ./.github/workflows/ui-build.yml
    permissions:
      actions: write
      contents: read

  ui-checks:
    name: Checks
    needs: ui-build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          # cache: "npm"
          # cache-dependency-path: "ui/apps/chat/package-lock.json"
          package-manager-cache: false

      - name: Download built UI artifacts
        uses: actions/download-artifact@v6
        with:
          name: llama-ui.zip
          path: ui/apps/chat/dist/

      - name: Install dependencies
        id: setup
        if: ${{ steps.node.conclusion == 'success' }}
        run: npm ci
        working-directory: ui/apps/chat

      - name: Run type checking
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run check
        working-directory: ui/apps/chat

      - name: Run linting
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npm run lint
        working-directory: ui/apps/chat

      - name: Install Playwright browsers
        id: playwright
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npx playwright install --with-deps
        working-directory: ui/apps/chat

      - name: Run Client tests
        if: ${{ always() && steps.playwright.conclusion == 'success' }}
        run: npm run test:client
        working-directory: ui/apps/chat

      - name: Run Unit tests (uses pre-built dist/ from ui-build)
        if: ${{ always() && steps.playwright.conclusion == 'success' }}
        run: npm run test:unit
        working-directory: ui/apps/chat

  e2e-tests:
    name: E2E Tests
    needs: ui-build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha || github.head_ref || github.ref_name }}

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          # cache: "npm"
          # cache-dependency-path: "ui/apps/chat/package-lock.json"
          package-manager-cache: false

      - name: Install dependencies
        id: setup
        if: ${{ steps.node.conclusion == 'success' }}
        run: npm ci
        working-directory: ui/apps/chat

      - name: Download built UI artifacts (reuses ui-build)
        uses: actions/download-artifact@v6
        with:
          name: llama-ui.zip
          path: ui/apps/chat/dist/

      - name: Install Playwright browsers
        id: playwright
        if: ${{ always() && steps.setup.conclusion == 'success' }}
        run: npx playwright install --with-deps
        working-directory: ui/apps/chat

      - name: Build Storybook
        if: ${{ always() && steps.playwright.conclusion == 'success' }}
        run: npm run build-storybook
        working-directory: ui/apps/chat

      - name: Run UI tests
        if: ${{ always() && steps.playwright.conclusion == 'success' }}
        run: npm run test:ui -- --testTimeout=60000
        working-directory: ui/apps/chat

      - name: Run E2E tests (uses pre-built dist/ from ui-build)
        if: ${{ always() && steps.playwright.conclusion == 'success' }}
        run: npm run test:e2e
        working-directory: ui/apps/chat
