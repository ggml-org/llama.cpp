name: Bench weekly vLLM (DGX Spark)

on:
  schedule:
    # Saturday; it queues behind that night's nightly (same concurrency group) and is compared with it
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      columns:
        description: 'Comma-separated vLLM columns from weekly.yaml, e.g. M3-vllm-nvfp4,M2-vllm-fp4local (default: all)'
        required: false
        type: string
      suites:
        description: 'Comma-separated suites: serving,agentic (default: both)'
        required: false
        type: string
      configs:
        description: 'Comma-separated shell patterns on config names, e.g. mooncake_T02*,depth32768*_c8 (default: all)'
        required: false
        type: string
      vllm_image:
        description: 'Comma-separated COLUMN=IMAGE overrides of the recipe images (default: what NVIDIA recipes name today)'
        required: false
        type: string
      resume:
        description: 'Finish an interrupted run into its report, e.g. 2026-11-11_vllm: its ok runs are kept, the rest run with its images'
        required: false
        type: string

# never on pull requests: the runner is a shared, persistent box
permissions:
  contents: read

concurrency:
  # shared with the nightly: one job on the Spark at a time
  group: bench-nightly-spark
  cancel-in-progress: false

jobs:
  bench:
    # on the host, not in a container: vLLM runs in docker, with the checkpoints mounted from NIGHTLY_HOME
    runs-on: [self-hosted, Linux, gb10, perf]
    # 3 columns x 11 runs: ~6.2 h measured (tools/server/bench/nightly/BENCHMARKS.md)
    timeout-minutes: 600

    env:
      BENCH_DIR: tools/server/bench/nightly

    steps:
      - name: Bench home
        id: home
        # the nightly's folder, next to the checkouts in the runner's work folder
        run: |
          echo "NIGHTLY_HOME=$(dirname "$RUNNER_WORKSPACE")/llama-nightly" >> "$GITHUB_ENV"

      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: Python venv
        id: venv
        # uv's standalone binary: no system Python or root needed on the host
        env:
          UV_VERSION: 0.13.7
        run: |
          UV="$NIGHTLY_HOME/uv-bin/uv"
          if ! "$UV" --version 2>/dev/null | grep -qF " $UV_VERSION "; then
            curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | env UV_UNMANAGED_INSTALL="$NIGHTLY_HOME/uv-bin" sh
          fi
          "$UV" venv -q --allow-existing --python 3.12 --managed-python "$NIGHTLY_HOME/venv"
          VIRTUAL_ENV="$NIGHTLY_HOME/venv" "$UV" pip install -q -r "$BENCH_DIR/requirements.txt"

      - name: Prefetch images and checkpoints
        id: prefetch
        env:
          COLUMNS_IN: ${{ inputs.columns }}
          VLLM_IMAGE: ${{ inputs.vllm_image }}
        run: |
          "$NIGHTLY_HOME/venv/bin/python" "$BENCH_DIR/nightly.py" prefetch --config "$BENCH_DIR/weekly.yaml" ${COLUMNS_IN:+--models "$COLUMNS_IN"} ${VLLM_IMAGE:+--vllm-image "$VLLM_IMAGE"}

      - name: Run suites
        id: run
        env:
          COLUMNS_IN: ${{ inputs.columns }}
          SUITES: ${{ inputs.suites }}
          CONFIGS: ${{ inputs.configs }}
          RESUME: ${{ inputs.resume }}
          NIGHTLY_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "$NIGHTLY_HOME/venv/bin/python" "$BENCH_DIR/nightly.py" run --config "$BENCH_DIR/weekly.yaml" ${SUITES:+--suites "$SUITES"} ${COLUMNS_IN:+--models "$COLUMNS_IN"} ${CONFIGS:+--configs "$CONFIGS"} ${RESUME:+--resume "$RESUME"} --summary "$GITHUB_STEP_SUMMARY"

      - name: Stop leftover containers
        if: ${{ always() }}
        run: |
          docker ps -q --filter name=bench-vllm- | xargs -r docker rm -f

      - name: Upload results
        if: ${{ always() && steps.run.outputs.night_dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-weekly-${{ steps.run.outputs.night_id }}
          path: ${{ steps.run.outputs.night_dir }}
          retention-days: 30
