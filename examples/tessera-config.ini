#
# tessera-config.ini: example INI config for --tessera-config FILE.
#
# Lines starting with '#' or ';' are comments. Blank lines are ignored.
# Section headers in [brackets] group related options. Within a section,
# `key = value` sets one --tessera-* option (the --tessera- prefix is
# dropped; everything else matches the CLI flag name exactly).
#
# Precedence (highest wins):
#     1. explicit CLI flags
#     2. environment variables (LLAMA_TESSERA_*, etc.)
#     3. values in this file
#     4. built-in defaults
#
# Quoted values: key = "some value with spaces" is supported. Both single
# and double quotes are accepted; \" and \\ inside double-quoted values
# are escape sequences.
#
# This file is loaded with:
#     llama-quantize --tessera-config examples/tessera-config.ini ...
# or:
#     TESSERA_CONFIG=examples/tessera-config.ini llama-quantize ...
#
# The example below shows a realistic AWQ + evolve combo for a small
# calibration pass. Edit freely; everything outside [section] headers is a
# comment.
#

# ---------------------------------------------------------------------------
# General / cross-cutting flags. These map directly to:
#     --tessera-mode
#     --tessera-nthreads
#     --tessera-imatrix
#     --tessera-champq
#     --tessera-calibrate-only
#     --tessera-adaptive-requantize
#     --force-requantize            (no --tessera- prefix on the CLI)
# ---------------------------------------------------------------------------
[general]
# mode: off | default | calibrate-only | evolve-only
mode              = default
# 0 = use llama.cpp's thread detection
nthreads          = 0
# imatrix = /path/to/quantize.imatrix
# champq is on by default; flip with `champq = false` to disable
champq            = true
calibrate-only    = false
adaptive-requantize = true
# force-requantize only takes effect when --quantize-db is also set
force-requantize  = false

# ---------------------------------------------------------------------------
# [evolve]: --tessera-evolve-* (GA search over quant knobs)
# ---------------------------------------------------------------------------
[evolve]
evolve-iters      = 8
evolve-islands    = 4
evolve-population = 16
# seed: 0 = use wall clock
evolve-seed       = 0
evolve-only       = false

# ---------------------------------------------------------------------------
# [awq]: --tessera-awq-* (Activation-aware Weight Quantization)
# ---------------------------------------------------------------------------
[awq]
# alpha: "auto" or a numeric value
awq-alpha = auto
awq-clip  = 1.0

# ---------------------------------------------------------------------------
# [policy]: --tessera-policy*, --tessera-outlier-frac,
#           --tessera-range-selection, --tessera-ternary-threshold
# ---------------------------------------------------------------------------
[policy]
# policy      = /path/to/policy.json
# policy-out  = /path/to/policy.out.json
outlier-frac      = 0.005
# range-selection: legacy | imatrix-mse | septq
range-selection   = legacy
# ternary-threshold: "auto" or a numeric value
ternary-threshold = auto

# ---------------------------------------------------------------------------
# [l5]: --tessera-l5-* (L2 -> L5 adaptive requantize loop)
# ---------------------------------------------------------------------------
[l5]
l5-generations            = 3
l5-flag-multiplier        = 1.5
l5-alpha-min              = 0.1
l5-clip-min               = 0.1
l5-outlier-overshoot-scale = 0.5
l5-outlier-frac-cap       = 0.25
# l5-out: empty = default path (beside --tessera-policy-out)
# l5-out  = /path/to/l5-loop.json

# ---------------------------------------------------------------------------
# [runtime]: L2 forward-pass differential and sidecar capture
#   --tessera-runtime-probe, --tessera-runtime-probe-bf16,
#   --tessera-l2-out, --tessera-dequant-*, --tessera-matmul-output-*
# ---------------------------------------------------------------------------
[runtime]
# runtime-probe, runtime-probe-bf16, l2-out, dequant-dir,
# matmul-output-dir are all paths; leave empty to disable.
# runtime-probe      = /path/to/probe/manifest
# runtime-probe-bf16 = /path/to/bf16/model.gguf
# l2-out             = /path/to/l2-report.json
# dequant-dir        = /path/to/dequant/sidecars
dequant-stride        = 1
# matmul-output-dir  = /path/to/matmul/sidecars
matmul-output-stride  = 1

# ---------------------------------------------------------------------------
# [l15]: --tessera-l15-dtype (dtype of the L1.5 reference sidecar)
# ---------------------------------------------------------------------------
[l15]
# l15-dtype: f16 (default) | f32 (legacy)
l15-dtype = f16

# ---------------------------------------------------------------------------
# [ga]: --tessera-ga-checkpoint
# ---------------------------------------------------------------------------
[ga]
# ga-checkpoint = /path/to/ga.checkpoint.json

# ---------------------------------------------------------------------------
# [w4a4]: --tessera-w4a4, --tessera-w4a4-outlier-thresh
# ---------------------------------------------------------------------------
[w4a4]
w4a4                = false
w4a4-outlier-thresh = 6.0

# ---------------------------------------------------------------------------
# [dpace]: --tessera-dpace, --tessera-dpace-* (D-PACE adaptive weights)
# ---------------------------------------------------------------------------
[dpace]
# dpace: path to the input spec/calib JSONL
# dpace = /path/to/spec.jsonl
# dpace-out: empty = default <input>.dpace.json
# dpace-out   = /path/to/dpace.json
dpace-alpha = 0.1
dpace-gamma = 3.0

# ---------------------------------------------------------------------------
# [adapt]: --tessera-adapt, --tessera-adapt-* (adaptation receipt)
# ---------------------------------------------------------------------------
[adapt]
# adapt = /path/to/adapt/input.json
# adapt-out = /path/to/adapt-receipt.json
adapt-dry-run = false
adapt-epsilon = 0.02

# ---------------------------------------------------------------------------
# [capability]: --tessera-capability-*, capability loop output
# ---------------------------------------------------------------------------
[capability]
# capability-eval = /path/to/capability/input
# capability-out  = /path/to/capability/receipt.json

# ---------------------------------------------------------------------------
# [acceptance]: --tessera-acceptance, --tessera-acceptance-out
# ---------------------------------------------------------------------------
[acceptance]
acceptance     = true
# acceptance-out = /path/to/acceptance/receipt.json

# ---------------------------------------------------------------------------
# [anonymize]: tier-2 anonymizer (--tessera-anonymize*)
# ---------------------------------------------------------------------------
[anonymize]
# anonymize     = /path/to/input.txt
# anonymize-out = /path/to/output.txt
# anonymize-level: light | balanced | aggressive
anonymize-level = balanced
# anonymize-map = /path/to/pseudonym-map.json

# ---------------------------------------------------------------------------
# [throughput]: north-star throughput harness (--tessera-throughput*)
# ---------------------------------------------------------------------------
[throughput]
# throughput     = /path/to/workload.yaml
# throughput-out = /path/to/throughput/receipt.json

# ---------------------------------------------------------------------------
# [dataset]: drafter training dataset prep (--tessera-dataset*)
# ---------------------------------------------------------------------------
[dataset]
# dataset     = /path/to/input.jsonl
# dataset-out = /path/to/dataset.out.txt
# dataset-mode: text | pairs | lk | dflash
dataset-mode = text

# ---------------------------------------------------------------------------
# [kernel-fitness]: --tessera-kernel-fitness*
# ---------------------------------------------------------------------------
[kernel-fitness]
kernel-fitness       = false
kernel-fitness-blend = 1.0
# kernel-fitness-dir = /path/to/fitness/dir
